services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    image: lesson13-etl:latest
    environment:
      RAW_DIR: /app/data/raw
      DB_PATH: /app/data/pipeline.db
      POSTGRES_DSN: postgresql+psycopg://etl:etl@postgres:5432/etl
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["jupyter", "nbconvert", "--to", "notebook", "--execute", "etl_pipeline.ipynb", "--output", "executed_etl_pipeline.ipynb"]

volumes:
  postgres_data:
